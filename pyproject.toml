[project]
name = "local-aso-tracker"
version = "0.5.0"
description = "Local-first App Store keyword ranking tracker"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "mcp>=1.20,<2",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
aso = "local_aso_tracker.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_aso_tracker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/local_aso_tracker/cli.py" = ["B008"]
# The offline report contains embedded HTML/CSS/JavaScript template lines.
"src/local_aso_tracker/reports/html.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: opt-in tests that call Apple's public API"]
